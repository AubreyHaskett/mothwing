# XcodeGen manifest. Run `xcodegen generate` from the repo root to produce
# MothWingSpike.xcodeproj, then open it in Xcode. See SPIKE.md for the full
# procedure (and a manual fallback if you don't have xcodegen).
name: MothWingSpike
options:
  bundleIdPrefix: com.mothwing.spike
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  MothWingSpike:
    path: spike

targets:
  MothWingSpike:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: spike/App
      - path: spike/Models
        type: folder
        buildPhase: resources
    dependencies:
      - package: MothWingSpike
        product: SpikeKit
      - package: MothWingSpike
        product: SpikeEngine
    info:
      path: spike/App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mothwing.spike.app
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: G75F4V32M9
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic

  MothWingSpike-Sim:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: spike/App
      - path: spike/Models
        type: folder
        buildPhase: resources
    dependencies:
      - package: MothWingSpike
        product: SpikeKit
    info:
      path: spike/App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mothwing.spike.sim
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
